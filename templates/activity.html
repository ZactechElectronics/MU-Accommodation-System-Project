<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MU • Activity Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo-area">
                <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
                <span class="logo-text">MULUNGUSHI</span>
                <span class="logo-sub">Accommodation System</span>
            </div>
            <nav class="nav">
                <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
                <a href="students.html" class="nav-item"><i class="fas fa-user-graduate"></i> <span>Students</span></a>
                <div class="nav-divider"></div>
                <div class="nav-section-title">Accommodation</div>
                <a href="applications.html" class="nav-item"><i class="fas fa-file-signature"></i> <span>Applications</span></a>
                <a href="on-campus.html" class="nav-item"><i class="fas fa-building"></i> <span>On‑Campus</span></a>
                <a href="off-campus.html" class="nav-item"><i class="fas fa-home"></i> <span>Off‑Campus</span></a>
                <a href="analytics.html" class="nav-item"><i class="fas fa-chart-pie"></i> <span>Analytics</span></a>
                <a href="activity.html" class="nav-item active"><i class="fas fa-clock"></i> <span>Activity Monitor</span></a>
                <div class="nav-divider"></div>
                <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> <span>Settings</span></a>
                <a href="/" class="nav-item logout-btn"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="page-title">
                    <h1>Activity Monitor</h1>
                    <p>Track system activities and changes</p>
                </div>
                <div class="admin-badge"><i class="fas fa-user-shield"></i> Administrator</div>
            </header>

            <div class="info-card">
                <div class="card-header">
                    <h2><i class="fas fa-clock"></i> Recent Activities</h2>
                    <button class="btn-outline" id="clearActivityBtn"><i class="fas fa-trash"></i> Clear Log</button>
                </div>
                <div class="card-body">
                    <div class="activity-filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="login">Logins</button>
                        <button class="filter-btn" data-filter="application">Applications</button>
                        <button class="filter-btn" data-filter="accommodation">Accommodation</button>
                    </div>
                    <div class="activity-timeline" id="activityTimeline">
                        <div style="text-align:center; padding:40px;">Loading activities...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/services/api.service.js' %}"></script>
    <script src="{% static 'js/services/auth.service.js' %}"></script>
    <script src="{% static 'js/services/student.service.js' %}"></script>
    <script src="{% static 'js/services/accommodation.service.js' %}"></script>
    <script src="{% static 'js/services/application.service.js' %}"></script>
    <script src="{% static 'js/app.js' %}"></script>
    <script src="{% static 'js/activity.js' %}"></script>
</body>
</html>
