<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f0f0f0; padding: 20px; border-radius: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Dashboard API Test</h1>
    <div id="result">Loading...</div>

    <script>
        fetch('/api/dashboard/stats/')
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = `
                    <h2>API Response:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <h3>Summary:</h3>
                    <ul>
                        <li>Total Students: <strong class="success">${data.total_students}</strong></li>
                        <li>Accommodated: ${data.accommodated_students}</li>
                        <li>Pending Applications: ${data.pending_applications}</li>
                        <li>Approved Applications: ${data.approved_applications}</li>
                    </ul>
                `;
            })
            .catch(error => {
                document.getElementById('result').innerHTML = `
                    <h2 class="error">Error:</h2>
                    <pre>${error}</pre>
                `;
            });
    </script>
</body>
</html>
