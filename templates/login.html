<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MU • Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a2b3e 0%, #1a4a6e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
        }
        h2 { color: #1a2a3a; margin-bottom: 5px; }
        h3 { color: #f5a623; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f5a623;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #e09512; }
        .error { color: red; margin-top: 10px; }
        .info { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Mulungushi University</h2>
        <h3>Accommodation Portal</h3>
        <div id="errorMsg" class="error"></div>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="info">
            <strong>Test:</strong> student2024 / student123 | admin / admin123
        </div>
    </div>
    <script>
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            if (!username || !password) {
                errorDiv.textContent = 'Enter username and password';
                return;
            }
            errorDiv.textContent = '';
            try {
                const res = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    if (data.user.role === 'admin') {
                        location.href = '/admin-dashboard.html';
                    } else {
                        location.href = '/student-dashboard.html';
                    }
                } else {
                    errorDiv.textContent = data.message || 'Invalid credentials';
                }
            } catch(e) {
                errorDiv.textContent = 'Network error';
            }
        }
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
